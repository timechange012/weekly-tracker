<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>متتبع الـ 25 نقطة الأسبوعي</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
      --success: #22c55e;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); margin: 0; padding: 12px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; }

    .card { background: var(--card); border-radius: 12px; padding: 20px; border: 1px solid var(--border); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
    h2, h3 { text-align: center; margin-top: 0; margin-bottom: 15px; }

    /* Auth Screen */
    .input-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: var(--muted); }
    input[type="email"], input[type="password"] {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0f172a; color: #fff; direction: ltr; text-align: left;
    }
    .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--accent); color: #0f172a; font-weight: bold; cursor: pointer; font-size: 1rem; }
    .btn:hover { background: var(--accent-hover); }
    .toggle-text { text-align: center; margin-top: 15px; font-size: 0.85rem; }
    .toggle-text a { color: var(--accent); cursor: pointer; text-decoration: underline; }

    /* App Screen */
    #app-screen { display: none; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .logout-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }

    /* Calendar Controls */
    .week-nav { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); }
    .nav-btn { background: var(--border); color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .week-display { text-align: center; }
    .week-title { font-weight: bold; font-size: 0.95rem; color: var(--accent); }
    .week-dates { font-size: 0.75rem; color: var(--muted); }

    /* Progress Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; text-align: center; }
    .stat-box { background: #0f172a; padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
    .stat-val { font-size: 1.2rem; font-weight: bold; color: var(--success); }
    .stat-lbl { font-size: 0.7rem; color: var(--muted); }

    /* Days Tab Bar */
    .days-bar { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 15px; padding-bottom: 5px; }
    .day-tab { flex: 1; min-width: 45px; padding: 8px 4px; text-align: center; background: #0f172a; border-radius: 6px; border: 1px solid var(--border); font-size: 0.8rem; cursor: pointer; }
    .day-tab.active { background: var(--accent); color: #0f172a; font-weight: bold; }

    /* Checklist */
    .point-card { background: #0f172a; border-radius: 8px; padding: 12px; margin-bottom: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .point-text { font-size: 0.88rem; line-height: 1.4; flex: 1; }
    .point-num { font-weight: bold; color: var(--accent); margin-left: 8px; }
    input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--success); cursor: pointer; }

    .sync-status { font-size: 0.75rem; text-align: center; color: var(--muted); margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">

  <!-- 1. LOGIN / REGISTER SCREEN -->
  <div id="auth-screen" class="card">
    <h2 id="auth-title">تسجيل الدخول</h2>
    <div id="auth-error" style="color: #f87171; font-size: 0.85rem; margin-bottom: 10px; text-align: center;"></div>

    <div class="input-group">
      <label>البريد الإلكتروني (Email)</label>
      <input type="email" id="auth-email" placeholder="user@example.com" required>
    </div>

    <div class="input-group">
      <label>كلمة المرور (Password)</label>
      <input type="password" id="auth-password" placeholder="••••••••" required>
    </div>

    <button class="btn" id="auth-submit-btn" onclick="handleAuth()">دخول</button>

    <div class="toggle-text">
      <span id="toggle-label">ليس لديك حساب؟</span>
      <a onclick="toggleAuthMode()" id="toggle-link">أنشئ حساب جديد</a>
    </div>
  </div>

  <!-- 2. MAIN TRACKER SCREEN -->
  <div id="app-screen" class="card">
    <div class="top-bar">
      <span id="user-display" style="font-size: 0.8rem; color: var(--muted); text-align: left; direction: ltr;"></span>
      <button class="logout-btn" onclick="logout()">خروج</button>
    </div>

    <!-- Calendar Nav -->
    <div class="week-nav">
      <button class="nav-btn" onclick="changeWeek(-1)">« الأسبوع السابق</button>
      <div class="week-display">
        <div class="week-title" id="week-title-text">الأسبوع الحالي</div>
        <div class="week-dates" id="week-dates-text">...</div>
      </div>
      <button class="nav-btn" onclick="changeWeek(1)">الأسبوع التالي »</button>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-val" id="stat-daily">0 / 25</div>
        <div class="stat-lbl">إنجاز اليوم</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stat-daily-pct">0%</div>
        <div class="stat-lbl">نسبة اليوم</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stat-weekly">0 / 175</div>
        <div class="stat-lbl">المجموع الأسبوعي</div>
      </div>
    </div>

    <!-- Days Bar -->
    <div class="days-bar" id="days-bar">
      <div class="day-tab active" onclick="selectDay(0)">الإثنين</div>
      <div class="day-tab" onclick="selectDay(1)">الثلاثاء</div>
      <div class="day-tab" onclick="selectDay(2)">الأربعاء</div>
      <div class="day-tab" onclick="selectDay(3)">الخميس</div>
      <div class="day-tab" onclick="selectDay(4)">الجمعة</div>
      <div class="day-tab" onclick="selectDay(5)">السبت</div>
      <div class="day-tab" onclick="selectDay(6)">الأحد</div>
    </div>

    <!-- 25 Points Checklist -->
    <div id="points-container"></div>

    <div id="sync-indicator" class="sync-status">جاري الاتصال بالسحابة...</div>
  </div>

</div>

<!-- Firebase Modular SDK -->

    "Stop passivity,be active;they are consuming you.فقط في وقت اللازم. توقّف عن استعمال الاجهزة والتلفون لغير العمل+color filters، اقنوم: شغلك عيلتك استراحة ما تجيب هموم وافكار الاخرين عبيتك من رجال اجتماع ودين وسياسة وعلم وخيال وميديا .. ",
    "يكفي هوس بالأكل والتجارب الجديدة بكل شي بالحياة..أنزل وزنك وكول نقدي.لا تموت من قلة الأكل. ",
    ".Follow girl succcesful in living and pigeons, not the men who create unecessary wars and problems..لا تؤذي احد سوى دفاع استباقي. اهتم بصحتك الجسدية والنفسية والجلدية… ",

    "اكتب لي بدك  دغري تعملو عورقة اليوم ونفذو.اربط النجاح بالانضباط والعمل اليومي.ACT  لا تنتظر الرغبة في العمل!لمدة 5 دقائق فقط ابدأ بأي  تاسك ومن دون التفكير في النتيجة. ",
    "السعي للزواج بشكل واقعي على الأرض.تعرف على أكثر من بنت حتى لو من غير دين لتختر واحدة مقبولة تكون سندك ولا تبالغ الجمال",

    ".حافظ على التفكير الإيجابي والتفاؤل والمثابرة.لاتتأخر واستبق الأمور وأسرع في التنفيذ ثم غير لاحقا” ان لزم ",

    " االمصاري كل شي أو كتير مهمة. ما في فرق بالمقصود!! اركض اتطلع هلق عمرك  بعدين ما فيك.اعمل باتقان وكفاءة وما يلزم من تمثيل اجتماعي واحترام. اكتم حياتك الخاصة ومشاريعك المستقبلية واسرارك",

    "اخوتك احسن منك Arab countries.Forget ID but prepare if..//بيك تعب كرمالك وكرمال  تنجح. كرس ١٠ سنين",
    "ممكن حل عقدك بلد مسموح بنظافة. التزم   M ٠-١٥ بالشهر . ضروري وقف خيالات ومشاهدات بتضيعك بزيادة.كن ذكي. صلي للتوفيق، للقداسة تبرع (كليهما ممكن مرة سنويا). Euthanesie/Abortion..decision in time.زبشو احسن مني محمد عندو 3 ولاد ومسلمزخلص شوف بس حالك وعيللتك لانن استنزفوك واستنزفت ما تعطي  ممنوع الغلبة.ضرر نفسك ومنفعة غيرك بنفس الوقت ممنوع! اذا لم تكن ذئبا أكلتك الذئاب وكون ذئب لمصلحتك ما تشوف غير مصلحتك وما تشتغل ببلاش بتلاقي راحتك ما تعمل منيح مع حدا مين ما كان يكون وكون قد حالك دور عراحتك ومصلحتك وربحك"
  ];

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let isRegister = false;
  let currentUser = null;
  let currentWeekOffset = 0;
  let selectedDayIndex = 0; // 0=Mon, 6=Sun
  let currentWeekData = {};
  let unsubscribeSnap = null;

  onAuthStateChanged(auth, (user) => {
    if (user) {
      currentUser = user;
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      document.getElementById('user-display').innerText = user.email;
      updateCalendarView();
    } else {
      currentUser = null;
      document.getElementById('auth-screen').style.display = 'block';
      document.getElementById('app-screen').style.display = 'none';
      if (unsubscribeSnap) unsubscribeSnap();
    }
  });

  window.toggleAuthMode = () => {
    isRegister = !isRegister;
    document.getElementById('auth-title').innerText = isRegister ? "إنشاء حساب جديد" : "تسجيل الدخول";
    document.getElementById('auth-submit-btn').innerText = isRegister ? "تسجيل" : "دخول";
    document.getElementById('toggle-label').innerText = isRegister ? "لديك حساب بالفعل؟" : "ليس لديك حساب؟";
    document.getElementById('toggle-link').innerText = isRegister ? "سجل دخولك" : "أنشئ حساب جديد";
  };

  window.handleAuth = async () => {
    const email = document.getElementById('auth-email').value;
    const pass = document.getElementById('auth-password').value;
    const errDiv = document.getElementById('auth-error');
    errDiv.innerText = "";

    try {
      if (isRegister) await createUserWithEmailAndPassword(auth, email, pass);
      else await signInWithEmailAndPassword(auth, email, pass);
    } catch (e) {
      errDiv.innerText = e.message.replace("Firebase: ", "");
    }
  };

  window.logout = () => signOut(auth);

  // Calendar Week Computation
  function getWeekKey(offset) {
    const d = new Date();
    d.setDate(d.getDate() + (offset * 7));
    const day = d.getDay();
    const diffToMon = d.getDate() - day + (day === 0 ? -6 : 1);
    const mon = new Date(d.setDate(diffToMon));
    
    const year = mon.getFullYear();
    const firstJan = new Date(year, 0, 1);
    const weekNum = Math.ceil((((mon - firstJan) / 86400000) + firstJan.getDay() + 1) / 7);
    
    const sun = new Date(mon);
    sun.setDate(mon.getDate() + 6);
    
    const formatDate = (date) => `${date.getDate()}/${date.getMonth()+1}/${date.getFullYear()}`;
    return {
      key: `${year}-W${weekNum < 10 ? '0' : ''}${weekNum}`,
      rangeText: `${formatDate(mon)} — ${formatDate(sun)}`,
      isCurrent: offset === 0
    };
  }

  function updateCalendarView() {
    const weekInfo = getWeekKey(currentWeekOffset);
    document.getElementById('week-title-text').innerText = weekInfo.isCurrent ? "الأسبوع الحالي" : `أسبوع (${weekInfo.key})`;
    document.getElementById('week-dates-text').innerText = weekInfo.rangeText;

    if (unsubscribeSnap) unsubscribeSnap();

    const docRef = doc(db, "users", currentUser.uid, "weeks", weekInfo.key);
    unsubscribeSnap = onSnapshot(docRef, (docSnap) => {
      currentWeekData = docSnap.exists() ? docSnap.data() : {};
      renderUI();
      document.getElementById('sync-indicator').innerText = "✓ متزامن مع السحابة فورياً";
    });
  }

  window.changeWeek = (direction) => {
    currentWeekOffset += direction;
    updateCalendarView();
  };

  window.selectDay = (index) => {
    selectedDayIndex = index;
    const tabs = document.querySelectorAll('.day-tab');
    tabs.forEach((tab, i) => tab.classList.toggle('active', i === index));
    renderUI();
  };

  function renderUI() {
    const days = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'];
    const currentDayKey = days[selectedDayIndex];
    const container = document.getElementById('points-container');
    container.innerHTML = "";

    let dayCheckedCount = 0;
    let totalWeeklyChecked = 0;

    // Calculate weekly total
    days.forEach(d => {
      for (let i = 0; i < 25; i++) {
        if (currentWeekData[`${d}_${i}`]) totalWeeklyChecked++;
      }
    });

    // Render 25 points for active day
    pointsList.forEach((text, i) => {
      const isChecked = !!currentWeekData[`${currentDayKey}_${i}`];
      if (isChecked) dayCheckedCount++;

      const div = document.createElement('div');
      div.className = 'point-card';
      div.innerHTML = `
        <span class="point-num">.${i+1}</span>
        <span class="point-text">${text}</span>
        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="togglePoint('${currentDayKey}', ${i}, this.checked)">
      `;
      container.appendChild(div);
    });

    // Update Stats
    document.getElementById('stat-daily').innerText = `${dayCheckedCount} / 25`;
    document.getElementById('stat-daily-pct').innerText = `${Math.round((dayCheckedCount / 25) * 100)}%`;
    document.getElementById('stat-weekly').innerText = `${totalWeeklyChecked} / 175`;
  }

  window.togglePoint = async (dayKey, pointIndex, value) => {
    const weekInfo = getWeekKey(currentWeekOffset);
    const docRef = doc(db, "users", currentUser.uid, "weeks", weekInfo.key);
    
    currentWeekData[`${dayKey}_${pointIndex}`] = value;
    await setDoc(docRef, { [`${dayKey}_${pointIndex}`]: value }, { merge: true });
  };
</script>

</body>
</html>
